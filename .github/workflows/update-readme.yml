name: Update Profile README

on:
  schedule:
    - cron: '0 0 * * 1' # Her Pazartesi otomatik çalışır
  workflow_dispatch: # Actions sekmesinden elle çalıştırmak için

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Update Script
        run: python scripts/update_readme.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: profil README otomatik güncellendi"
          title: "🤖 Otomatik README Güncellemesi"
          body: |
            Tüm repoların taranarak son aktif projelerin ve kullanılan diller `README.md` dosyasına yansıtıldı.
            
            Değişikliği kontrol edip **Merge** edebilirsin.
          branch: auto-readme-update
          delete-branch: true
